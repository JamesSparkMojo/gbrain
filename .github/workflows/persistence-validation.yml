name: Durable persistence validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    name: ${{ matrix.engine }} / Bun ${{ matrix.bun }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [pglite, postgres]
        bun: ['1.3.11', '1.3.13']
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gbrain_test
          POSTGRES_PASSWORD: gbrain_test
          POSTGRES_DB: gbrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gbrain_test -d gbrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Execute 1000 schedules, six SIGKILL boundaries and 10000 process-separated writes
        env:
          DATABASE_URL: postgres://gbrain_test:gbrain_test@127.0.0.1:5432/gbrain_test
        run: >-
          bun --no-env-file scripts/persistence/validate.ts --engine=${{ matrix.engine }}
          --manifest=.context/persistence-manifest.json
      - name: Upload executed-case and latency manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: persistence-${{ matrix.engine }}-bun-${{ matrix.bun }}
          path: .context/persistence-manifest.json
          if-no-files-found: error
